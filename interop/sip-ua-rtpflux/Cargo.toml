# The sip-ua <-> rtpflux native API integration test tool. Its own
# workspace: neither sip-ua nor the ferrosip workspace depends on rtpflux
# or tokio. rtpflux is pinned to the revision this was verified against.
[package]
name = "sip-ua-rtpflux"
version = "0.2.0"
edition = "2024"
rust-version = "1.100"
license = "GPL-3.0-or-later"
publish = false

[workspace]

[dependencies]
sip-ua = { path = "../../crates/sip-ua", default-features = false, features = ["recovery"] }
rtpflux-client-async = { git = "https://github.com/RustedBytes/rtpflux", rev = "cac94112d993ae1e61614b0c4bbb8e416d45059c" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros"] }
serde_json = "1"
