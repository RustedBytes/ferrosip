# l10-mysql-accounting: accounting into MySQL/MariaDB. Every call's INVITE
# transaction goes to `acc` (answered) or `missed_calls` (busy, no answer,
# canceled); every answered call that ends gives a row in `cdrs`. Dialogs
# are stored in the `dialog` table, so a call outlives a proxy restart.

[core]
workers = 2
rpc_socket = "${RPC_SOCK:-/tmp/ferrosip-l10.sock}"

[[listen]]
proto = "udp"
addr = "127.0.0.1:${SIP_PORT:-5060}"

[feature]
callee = "${CALLEE:-sip:127.0.0.1:5080}"   # the PBX behind us
trusted = "${TRUSTED:-127.0.0.0/8}"

[modules.cdr]                # acc
db_url = "${DB_URL:-mysql://ferrosip@127.0.0.1:3306/ferrosip}"
db_flag = 31                 # the bit of `flag ACC`, the first flag in main.fsr (bits from 31 down)
db_missed_flag = 30          # the bit of `flag ACC_MISSED`, the second
db_extra = "src_user=$fU;dst_user=$rU"
cdr_enable = true            # a `cdrs` row when an answered dialog ends

[modules.dialog]
db_mode = "realtime"         # confirmed dialogs in the `dialog` table, loaded at startup
db_url = "${DB_URL:-mysql://ferrosip@127.0.0.1:3306/ferrosip}"

[modules.txn]
fr_timer = "2s"              # no 1xx within 2s: 408
fr_inv_timer = "3s"          # ringing without an answer: 408 3s after the 1xx

[routing]
entry = "routes/main.fsr"
