# ferrosip for the monitoring example: a registrar and proxy with dialogs,
# the Prometheus exporter, and the AI module loaded (its panels show its
# counters; without an API key AI calls are refused).

loadmodule "maxfwd"
loadmodule "sl"
loadmodule "textops"
loadmodule "tm"
loadmodule "usrloc"
loadmodule "registrar"
loadmodule "rr"
loadmodule "siputils"
loadmodule "dialog"
loadmodule "ai"
loadmodule "prometheus"

modparam("prometheus", "listen", "127.0.0.1:9095")
modparam("ai", "media_ip", "127.0.0.1")

request_route {
    if !mf_process_maxfwd_header(10) {
        sl_send_reply(483, "Too Many Hops");
        exit;
    }
    if (ai_dialog()) exit;
    if (is_method("REGISTER")) {
        save("location");
        exit;
    }
    if (is_method("OPTIONS") && $rU == $null) {
        sl_send_reply(200, "OK");
        exit;
    }
    if (has_totag()) {
        if (loose_route() || is_method("ACK|BYE")) {
            t_relay();
            exit;
        }
        sl_send_reply(404, "Not Here");
        exit;
    }
    if (!lookup("location")) {
        sl_send_reply(404, "Not Found");
        exit;
    }
    # Dialogs only for calls that are relayed.
    if (is_method("INVITE")) {
        record_route();
        dlg_manage();
    }
    t_relay();
}
