# Routing only: modules and their parameters are in ../ferrosip.toml.
# Modules whose functions are used here (sl, textops, siputils, maxfwd…)
# load by themselves when run with --config.
#
# A minimal demo: anyone may register and call through it (ferrosip.toml's
# [lint] allows that here). Add authentication, as examples/fsr does,
# before using it anywhere else.

request_route {
    if (!mf_process_maxfwd_header(10)) {
        sl_send_reply(483, "Too Many Hops");
        exit;
    }
    if (!pike_check_req()) {
        exit;
    }
    if (has_totag()) {
        if (loose_route()) {
            t_relay();
            exit;
        }
        if (is_method("ACK") && t_check_trans()) {
            t_relay();
        }
        exit;
    }
    if (is_method("REGISTER")) {
        save("location");
        exit;
    }
    if (is_method("OPTIONS")) {
        sl_send_reply(200, "OK");
        exit;
    }
    if (!lookup("location")) {
        sl_send_reply(404, "Not Found");
        exit;
    }
    if (is_method("INVITE")) {
        record_route();
        dlg_manage();
        set_dlg_profile("calls");
    }
    t_relay();
}
