# ferrosip with HOMER: a registrar + proxy that sends every SIP transaction
# to heplify-server as HEPv3 (Homer's Kamailio example, see the README).

loadmodule "maxfwd"
loadmodule "sl"
loadmodule "textops"
loadmodule "tm"
loadmodule "usrloc"
loadmodule "registrar"
loadmodule "rr"
loadmodule "siputils"
loadmodule "siptrace"

# heplify-server publishes HEP on the host's port 9060 (docker-compose.yml).
modparam("siptrace", "duplicate_uri", "sip:127.0.0.1:9060")
modparam("siptrace", "hep_mode_on", 1)
modparam("siptrace", "hep_capture_id", 2001)
modparam("siptrace", "trace_to_database", 0)
modparam("siptrace", "trace_flag", 22)
modparam("siptrace", "trace_on", 1)

request_route {
    # Every request is traced with its transaction: the request in and out,
    # the replies in and out (also those ferrosip sends itself).
    setflag(22);

    if !mf_process_maxfwd_header(10) {
        sl_send_reply(483, "Too Many Hops");
        exit;
    }
    if is_method("OPTIONS") && $rU == $null {
        sl_send_reply(200, "Keepalive");
        exit;
    }
    # In-dialog requests (ACK, BYE, re-INVITE) follow the route set.
    if has_totag() {
        loose_route();
        t_relay();
        exit;
    }
    if is_method("REGISTER") {
        save("location");
        exit;
    }
    # Calls and other requests to registered users.
    if !lookup("location") {
        sl_send_reply(404, "Not Found");
        exit;
    }
    hlog("$ci", "ferrosip relays $rm to $ru");
    record_route();
    t_relay();
}
