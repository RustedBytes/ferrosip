[package]
name = "sip-ua"
description = "Reusable sans-IO SIP user agent engine (UAC/UAS transactions and dialogs) for B2BUA applications"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true
version.workspace = true

[dependencies]
sip-parser.workspace = true
sip-core.workspace = true
bumpalo.workspace = true
ring.workspace = true
md-5 = "0.11"
# ferrosip's transports (UDP/TCP/TLS/WS/WSS) for `runtime::spawn_transport`.
sip-transport = { workspace = true, optional = true }
# ferrosip's registrar store for `routing::UsrlocContacts`.
mod-location = { workspace = true, optional = true }
# Recoverable state records (feature `recovery`); serde_json comes from sip-core.
serde = { version = "1", features = ["derive"], optional = true }

[features]
default = ["transport"]
transport = ["dep:sip-transport"]
location = ["dep:mod-location"]
recovery = ["dep:serde"]

[lints]
workspace = true

[dev-dependencies]
# The example B2BUA's rtpflux client reuses ferrosip's ng bencode codec.
mod-media.workspace = true
# recoverable_ua binds with SO_REUSEPORT (two incarnations on one address).
socket2.workspace = true

[[example]]
name = "b2bua"
path = "examples/b2bua/main.rs"
required-features = ["transport"]

[[example]]
name = "bench"
path = "examples/bench.rs"

[[example]]
name = "recoverable_ua"
path = "examples/recoverable_ua.rs"
required-features = ["recovery"]

[[example]]
name = "bench_durable"
required-features = ["recovery"]

[[example]]
name = "bench_shards"
