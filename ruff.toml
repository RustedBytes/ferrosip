# Lint for the Python test kit, scenarios and helper scripts (CI runs
# `ruff check`). Correctness rules only: undefined names, unused imports
# and variables, late-binding closures, bare `except`, mutable defaults.
line-length = 160
target-version = "py310"
extend-exclude = ["tests/compat/kamailio", "site/src", "site/book", "target"]

[lint]
select = ["E9", "F", "E722", "B006", "B007", "B008", "B023", "PLE"]
