# ferrosip routing script (Kamailio-style). Compiled once at startup:
# function names → function pointers, arguments → pre-parsed values (fixups).

loadmodule "maxfwd"
loadmodule "tm"
loadmodule "usrloc"
loadmodule "registrar"

# Drop bindings whose TCP/TLS/WebSocket connection is gone (browsers).
modparam("usrloc", "handle_lost_tcp", 1)
modparam("registrar", "max_contacts", 10)
modparam("registrar", "max_expires", 7200)

request_route {
    if !mf_process(70) {
        reply(483, "Too Many Hops");
        exit;
    }

    # Keep-alive pings are answered statelessly, never touch tm.
    if method == "OPTIONS" && !ruri_user_prefix("relay") {
        reply(200, "OK");
        exit;
    }

    # Registrar: bind Contact(s) to the To AoR and answer the REGISTER.
    if method == "REGISTER" {
        save("location");
        exit;
    }

    remove_hdr("User-Agent");
    append_hdr("X-Proxied-By: ferrosip");

    # Registered users: R-URI → contact, next hop → where they registered
    # from (NAT-safe; reuses their TCP/TLS/WebSocket connection).
    if lookup("location") {
        if !t_relay() {
            sl_reply_error();
        }
        exit;
    }

    # Everything else: static transport per destination, resolved at startup.
    # Requests may arrive over UDP, TCP, TLS or WS — replies go back the same way.
    if ruri_user_prefix("tls") {
        t_relay("tls:127.0.0.1:5072");
        exit;
    }
    if ruri_user_prefix("tcp") {
        t_relay("tcp:127.0.0.1:5071");
        exit;
    }
    t_relay("udp:127.0.0.1:5070");
}
