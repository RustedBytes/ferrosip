name: Monitoring example

# Runs examples/monitoring: ferrosip + Prometheus + Grafana with the
# dashboard provisioned. Sends SIP traffic, checks every dashboard query
# returns data (smoke.py), lints the exposition with promtool, and renders
# the dashboard to a PNG (artifact). On changes to the example, the
# exporter or the statistics core; weekly; by hand.
on:
  push:
    branches: [main]
    paths:
      - examples/monitoring/**
      - crates/mod-prometheus/**
      - crates/sip-core/src/stats.rs
      - Dockerfile
      - .github/workflows/monitoring-example.yml
  pull_request:
    paths:
      - examples/monitoring/**
      - crates/mod-prometheus/**
      - crates/sip-core/src/stats.rs
      - Dockerfile
      - .github/workflows/monitoring-example.yml
  schedule:
    - cron: "17 5 * * 1" # Mondays
  workflow_dispatch:

concurrency:
  group: monitoring-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  monitoring:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: examples/monitoring
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build the ferrosip image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ferrosip:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start ferrosip + Prometheus + Grafana
        run: |
          docker compose config -q
          docker compose up -d --no-build
          for i in $(seq 60); do
            curl -fs -o /dev/null http://127.0.0.1:3000/api/health && curl -fs -o /dev/null http://127.0.0.1:9095/-/healthy && break; sleep 2
          done
          docker compose ps
      - name: Lint the exposition (promtool)
        run: curl -fsS http://127.0.0.1:9095/metrics | docker compose exec -T prometheus promtool check metrics
      - name: Traffic, then every dashboard query
        run: python3 smoke.py --seconds 45
      - name: Render the dashboard
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
          node screenshot.mjs dashboard.png
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: grafana-dashboard
          path: examples/monitoring/dashboard.png
          if-no-files-found: ignore
      - name: Logs
        if: always()
        run: docker compose logs --no-color --tail 80
      - name: Stop
        if: always()
        run: docker compose down -v
